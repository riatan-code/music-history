<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>音の系譜</title>
<!-- link card: logo + title only (no description) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="音の系譜">
<meta property="og:title" content="音の系譜">
<meta property="og:url" content="https://riatan-code.github.io/music-history/">
<meta property="og:image" content="https://riatan-code.github.io/music-history/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="音の系譜">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="音の系譜">
<meta name="twitter:image" content="https://riatan-code.github.io/music-history/og.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Mono:wght@400;500&family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="top">
  <a class="brand" href="#" data-home>
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-ja">音の系譜</span>
  </a>

  <nav class="tabpill" role="tablist">
    <span class="tabpill-bg" aria-hidden="true"></span>
    <button role="tab" data-view="map" aria-selected="true">系譜</button>
    <button role="tab" data-view="toc" aria-selected="false">目次</button>
    <button role="tab" data-view="fav" aria-selected="false">お気に入り<span class="tab-n"></span></button>
  </nav>

  <button class="search-btn" data-open-palette aria-label="検索">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
    <kbd>/</kbd>
  </button>
</header>

<main>
  <section class="view view-map is-active" data-view-panel="map">
    <div class="map-scroll">
      <div class="map-inner">
        <div class="lanes"></div>
        <svg class="edges"></svg>
        <div class="nodes"></div>
        <div class="lane-labels"></div>
      </div>
      <div class="map-spacer" aria-hidden="true"></div>
    </div>
  </section>

  <section class="view view-toc" data-view-panel="toc">
    <div class="toc">
      <nav class="toc-side"><span class="toc-ind" aria-hidden="true"></span></nav>
      <div class="toc-main"></div>
    </div>
  </section>

  <section class="view view-fav" data-view-panel="fav">
    <div class="lib">
      <header class="lib-head">
        <div class="lib-cover" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.2a4.3 4.3 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z" fill="currentColor"/></svg></div>
        <div class="lib-titles">
          <div class="lib-kicker">LIBRARY</div>
          <h2>お気に入りのアーティスト</h2>
          <div class="lib-count"></div>
        </div>
      </header>
      <div class="lib-bar">
        <div class="lib-sort" role="tablist">
          <button class="chip" data-sort="recent" role="tab">追加順</button>
          <button class="chip" data-sort="name" role="tab">名前順</button>
          <button class="chip" data-sort="era" role="tab">年代順</button>
        </div>
        <div class="lib-mode">
          <button class="icon-btn" data-mode="list" aria-label="リスト"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg></button>
          <button class="icon-btn" data-mode="grid" aria-label="グリッド"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg></button>
        </div>
      </div>
      <ol class="lib-items"></ol>
      <div class="lib-empty">
        <span class="lib-empty-ic"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.2a4.3 4.3 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z" fill="currentColor"/></svg></span>
        <p>アーティストのページで ♡ を押すと、ここに並びます</p>
      </div>
    </div>
  </section>

  <section class="view view-crate" data-view-panel="crate" hidden>
    <div class="crate-filter" role="tablist"></div>
    <div class="crate-grid"></div>
  </section>
</main>

<nav class="tabbar" aria-label="メニュー">
  <button data-view="map" aria-selected="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="6" r="2"/><circle cx="12" cy="18" r="2"/><circle cx="19" cy="9" r="2"/><path d="M7 6.5c4 0 3 11 5 11.5M14 17.5c3-1 2-8 5-8.5"/></svg><span>系譜</span></button>
  <button data-view="toc" aria-selected="false"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h1M4 12h1M4 18h1" stroke-width="2.4"/></svg><span>目次</span></button>
  <button data-view="fav" aria-selected="false"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.2a4.3 4.3 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z"/></svg><span>お気に入り</span></button>
  <button data-open-palette><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><span>検索</span></button>
</nav>

<aside class="sheet" aria-hidden="true">
  <div class="sheet-grab" aria-hidden="true"><i></i></div>
  <div class="sheet-bar">
    <button class="icon-btn sheet-back" aria-label="戻る">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="sheet-crumbs"></div>
    <button class="icon-btn sheet-close" aria-label="閉じる">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="sheet-body"></div>
</aside>

<div class="island" data-state="hidden">
  <i class="isl-grip" aria-hidden="true"></i>
  <div class="isl-video">
    <div class="isl-frame"><div id="yt"></div></div>
    <div class="isl-fallback">
      <a target="_blank" rel="noopener" class="isl-fallback-link">YouTubeで探す
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 17 17 7M9 7h8v8"/></svg>
      </a>
    </div>
  </div>
  <div class="isl-bar">
    <button class="isl-disc" aria-label="アーティスト"><span class="isl-disc-label"></span></button>
    <button class="isl-txt" aria-label="動画を表示">
      <b class="isl-title"></b>
      <span class="isl-artist"></span>
    </button>
    <button class="isl-play" aria-label="再生/一時停止">
      <svg viewBox="0 0 24 24" width="22" height="22"><path class="pp-a" d="M7 5 L12 8.2 L12 15.8 L7 19 Z"/><path class="pp-b" d="M12 8.2 L18 12 L18 12 L12 15.8 Z"/></svg>
    </button>
    <button class="isl-exp" aria-label="動画を表示">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg>
    </button>
    <button class="isl-close" aria-label="停止">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="isl-prog"><i></i></div>
</div>

<div class="palette" aria-hidden="true">
  <div class="palette-box" role="dialog" aria-label="検索">
    <div class="palette-in">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      <input type="text" placeholder="ジャンル、アーティスト、曲名" autocomplete="off" spellcheck="false">
      <kbd>esc</kbd>
    </div>
    <ul class="palette-list"></ul>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/worldmap.js"></script>
<script src="js/app.js"></script>
</body>
</html>
